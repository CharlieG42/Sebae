name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build runner (Hive adapters)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Les infos (deprecations liees a la version de Flutter) ne font pas
        # echouer le build ; les erreurs et warnings, si.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
