name: sebae
description: Sebae - plateforme modulaire d'outils metier (WildZimut).
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Persistance locale
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # Etat
  provider: ^6.1.5
  # Graphiques
  fl_chart: ^1.2.0
  # Utilitaires
  intl: ^0.20.3
  uuid: ^4.6.0
  file_picker: ^13.1.0
  window_manager: ^0.5.2
  # Exports WUECT (PDF / DOCX)
  pdf: ^3.11.0
  printing: ^5.10.0
  archive: ^4.0.7
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Codegen des TypeAdapters Hive
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
